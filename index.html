<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SB Mobile Detailing — Marketing Dashboard</title>
<style>
  :root {
    --plane:#f9f9f7; --surface:#ffffff; --text-primary:#0b0b0b; --text-secondary:#52514e;
    --muted:#898781; --grid:#e1e0d9; --baseline:#c3c2b7; --border:rgba(11,11,11,0.10);
    --series-1:#2a78d6; --series-2:#1baf7a; --series-3:#eda100; --series-4:#4a3aa7; --series-5:#0c8f9f;
    --good:#006300; --bad:#c23b3b; --accent-wash:rgba(42,120,214,0.06);
    --shadow:0 1px 2px rgba(11,11,11,0.04), 0 4px 16px rgba(11,11,11,0.04);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --plane:#0d0d0d; --surface:#1a1a19; --text-primary:#ffffff; --text-secondary:#c3c2b7;
      --muted:#898781; --grid:#2c2c2a; --baseline:#383835; --border:rgba(255,255,255,0.10);
      --series-1:#3987e5; --series-2:#199e70; --series-3:#c98500; --series-4:#9085e9; --series-5:#29a8b8;
      --good:#0ca30c; --bad:#e66767; --accent-wash:rgba(57,135,229,0.10);
      --shadow:0 1px 2px rgba(0,0,0,0.3), 0 4px 16px rgba(0,0,0,0.3);
    }
  }
  * { box-sizing:border-box; }
  html,body { margin:0; padding:0; scroll-behavior:smooth; }
  body { background:var(--plane); color:var(--text-primary);
    font-family:system-ui,-apple-system,"Segoe UI",sans-serif; line-height:1.45; -webkit-font-smoothing:antialiased; }
  .wrap { max-width:1120px; margin:0 auto; padding:0 20px; }

  header.page { padding-top:30px; }
  .brandrow { display:flex; align-items:baseline; gap:12px; flex-wrap:wrap; }
  h1 { font-size:26px; margin:0; letter-spacing:-0.01em; }
  .badge { font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:0.04em;
    color:var(--series-1); border:1px solid var(--border); border-radius:999px; padding:3px 10px; }
  .sub { color:var(--text-secondary); font-size:14px; margin-top:6px; }
  .source { color:var(--muted); font-size:12px; margin-top:2px; }

  /* sticky nav + filter bar */
  .toolbar { position:sticky; top:0; z-index:20; background:color-mix(in srgb, var(--plane) 88%, transparent);
    backdrop-filter:blur(8px); border-bottom:1px solid var(--border); margin-top:18px; }
  .toolbar .inner { max-width:1120px; margin:0 auto; padding:10px 20px; display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
  .nav { display:flex; gap:6px; flex-wrap:wrap; }
  .nav a { font-size:13px; font-weight:600; color:var(--text-secondary); text-decoration:none;
    padding:6px 12px; border-radius:8px; border:1px solid transparent; }
  .nav a:hover { background:var(--accent-wash); color:var(--text-primary); }
  .nav a .d { display:inline-block; width:8px; height:8px; border-radius:2px; margin-right:6px; vertical-align:middle; }
  .filter { margin-left:auto; display:flex; align-items:center; gap:8px; }
  .filter .lbl { font-size:12px; color:var(--muted); }
  .filter .seg { display:inline-flex; border:1px solid var(--border); border-radius:9px; overflow:hidden; }
  .filter button { font-size:13px; font-weight:600; color:var(--text-secondary); background:transparent;
    border:none; padding:6px 13px; cursor:pointer; }
  .filter button+button { border-left:1px solid var(--border); }
  .filter button.active { background:var(--series-1); color:#fff; }

  .section-h { display:flex; align-items:center; gap:10px; margin:36px 0 4px; scroll-margin-top:64px; }
  .section-h .dot { width:10px; height:10px; border-radius:3px; }
  .section-h h2 { font-size:19px; margin:0; letter-spacing:-0.01em; }
  .section-h .note { font-size:12.5px; color:var(--muted); margin-left:auto; }
  .mini-filter { display:inline-flex; border:1px solid var(--border); border-radius:9px; overflow:hidden; margin-left:2px; }
  .mini-filter button { font-size:12px; font-weight:600; color:var(--text-secondary); background:transparent;
    border:none; padding:5px 10px; cursor:pointer; white-space:nowrap; }
  .mini-filter button+button { border-left:1px solid var(--border); }
  .mini-filter button.active { background:var(--series-5); color:#fff; }
  @media (max-width:620px){ .section-h .note { margin-left:0; } .mini-filter { width:100%; } .mini-filter button { flex:1; } }

  .kpis { display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin:16px 0 14px; }
  .kpis.six { grid-template-columns:repeat(6,1fr); }
  @media (max-width:900px){ .kpis.six { grid-template-columns:repeat(3,1fr);} }
  @media (max-width:720px){ .kpis { grid-template-columns:repeat(2,1fr);} .kpis.six { grid-template-columns:repeat(2,1fr);} }
  .tile .hint { font-size:11.5px; color:var(--muted); margin-top:4px; line-height:1.35; }
  .tile { background:var(--surface); border:1px solid var(--border); border-radius:14px;
    padding:16px 16px 14px; box-shadow:var(--shadow); }
  .tile .label { font-size:12px; color:var(--muted); font-weight:600; text-transform:uppercase; letter-spacing:0.03em; }
  .tile .value { font-size:29px; font-weight:700; letter-spacing:-0.02em; margin-top:6px; }
  .tile .delta { font-size:12.5px; margin-top:4px; font-weight:600; }
  .delta.up { color:var(--good);} .delta.down { color:var(--bad);} .delta .vs { color:var(--muted); font-weight:400; }

  .analysis { background:var(--surface); border:1px solid var(--border); border-left:3px solid var(--series-1);
    border-radius:12px; padding:13px 16px; margin:0 0 20px; box-shadow:var(--shadow); }
  .analysis .h { font-size:11.5px; font-weight:700; text-transform:uppercase; letter-spacing:0.05em; color:var(--muted); margin-bottom:4px; }
  .analysis p { margin:0; font-size:14px; color:var(--text-secondary); line-height:1.55; }
  .analysis b { color:var(--text-primary); font-weight:600; }
  .up-txt { color:var(--good); font-weight:600; } .down-txt { color:var(--bad); font-weight:600; }

  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:18px; }
  @media (max-width:860px){ .grid2 { grid-template-columns:1fr;} }
  .card { background:var(--surface); border:1px solid var(--border); border-radius:16px;
    padding:18px 18px 12px; box-shadow:var(--shadow); margin-bottom:18px; }
  .card h3 { font-size:15px; margin:0 0 2px; letter-spacing:-0.01em; }
  .card .cap { font-size:12.5px; color:var(--muted); margin:0 0 8px; }
  .chart { width:100%; height:auto; display:block; overflow:visible; }
  .chart text { font-family:system-ui,sans-serif; }

  .tablewrap { overflow-x:auto; }
  .tablewrap.detail-scroll { max-height:340px; overflow:auto; border:1px solid var(--border); border-radius:10px; }
  .tablewrap.detail-scroll table { margin:0; }
  .tablewrap.detail-scroll thead th { position:sticky; top:0; z-index:1; background:var(--surface); }
  .tablewrap.detail-scroll tbody tr:last-child { border-bottom:none; }
  table { border-collapse:collapse; width:100%; font-size:13px; }
  th,td { text-align:right; padding:9px 12px; white-space:nowrap; font-variant-numeric:tabular-nums; }
  th:first-child,td:first-child { text-align:left; }
  thead th { color:var(--muted); font-weight:600; font-size:11.5px; text-transform:uppercase; letter-spacing:0.03em; border-bottom:1px solid var(--baseline);}
  tbody tr { border-bottom:1px solid var(--grid);}
  tbody tr:hover { background:var(--accent-wash);}
  tbody tr.partial td { color:var(--muted); font-style:italic;}
  .tnote { font-size:11.5px; color:var(--muted); padding:8px 12px 0; }

  .subhead { font-size:12.5px; font-weight:700; text-transform:uppercase; letter-spacing:0.05em; color:var(--muted); margin:10px 0 8px; }
  .subhead span { font-weight:400; text-transform:none; letter-spacing:0; }
  .priorities { display:grid; grid-template-columns:1fr 1fr; gap:16px; margin:10px 0 20px; }
  @media (max-width:760px){ .priorities{ grid-template-columns:1fr; } }
  .pcol { background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:14px 16px 12px; box-shadow:var(--shadow); }
  .ph { font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:0.05em; margin-bottom:8px; }
  .ph.win { color:var(--good); } .ph.watch { color:var(--bad); }
  .pitem { font-size:13.5px; color:var(--text-secondary); line-height:1.5; padding:8px 0; border-top:1px solid var(--grid); display:flex; gap:8px; align-items:baseline; }
  .pitem:first-of-type { border-top:none; }
  .pitem b { color:var(--text-primary); font-weight:600; }
  .pdot { width:7px;height:7px;border-radius:2px;flex:none;transform:translateY(5px);background:var(--good);}
  .pbadge { font-size:10.5px; font-weight:700; padding:2px 6px; border-radius:5px; flex:none; color:#fff; }
  .pbadge.p0{ background:var(--bad); } .pbadge.p1{ background:var(--series-3); color:#000;} .pbadge.p2{ background:var(--muted); }
  .pending { background:var(--surface); border:1px dashed var(--border); border-radius:14px; padding:16px; margin-bottom:18px;
    color:var(--muted); font-size:13px; }
  .pending b { color:var(--text-secondary); }
  .splitrow{display:flex;gap:2px;height:36px;border-radius:8px;overflow:hidden;margin:6px 0 14px;}
  .splitseg{display:flex;flex-direction:column;justify-content:center;padding:0 11px;background:var(--series-2);color:#fff;min-width:90px;}
  .splitseg.alt{background:var(--bad);}
  .splitseg span{font-size:10.5px;opacity:.92;line-height:1.1;} .splitseg b{font-size:15px;}
  .convgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:8px 0 2px;}
  .convgrid .k{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;font-weight:600;}
  .convgrid .v{font-size:16px;font-weight:600;margin-top:2px;}
  .flagbox{margin-top:13px;padding:10px 12px;border-radius:10px;background:var(--accent-wash);border:1px solid var(--border);font-size:13px;color:var(--text-secondary);line-height:1.5;}
  .flagbox b{color:var(--text-primary);}
  .stat{font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:5px;}
  .stat.on{background:rgba(12,163,12,.16);color:var(--good);} .stat.off{background:rgba(137,135,129,.2);color:var(--muted);}
  .totalrow td{font-weight:700;border-top:1px solid var(--baseline);}
  .status { display:block; font-size:12px; color:var(--muted); margin:20px 0 40px; }
  .tt { position:fixed; pointer-events:none; z-index:30; opacity:0; transition:opacity .08s;
    background:var(--surface); border:1px solid var(--border); border-radius:8px; box-shadow:var(--shadow);
    padding:8px 10px; font-size:12.5px; color:var(--text-primary); transform:translate(-50%,-115%); }
  .tt b { font-size:13px; } .tt .row { color:var(--text-secondary); margin-top:2px; }

  /* plain-English explainer */
  details.explain { background:var(--surface); border:1px solid var(--border); border-radius:14px; box-shadow:var(--shadow); margin:0 0 20px; }
  details.explain summary { cursor:pointer; list-style:none; padding:13px 16px; font-size:14px; font-weight:600; display:flex; align-items:center; gap:10px; }
  details.explain summary::-webkit-details-marker { display:none; }
  details.explain summary .q { width:22px; height:22px; border-radius:50%; background:var(--accent-wash); color:var(--series-1); display:inline-flex; align-items:center; justify-content:center; font-size:13px; font-weight:700; flex:none; }
  details.explain summary .hintt { margin-left:auto; font-size:12px; color:var(--muted); font-weight:400; }
  details.explain[open] summary .hintt { display:none; }
  .explain dl { margin:0; padding:0 16px 14px; display:grid; grid-template-columns:1fr 1fr; gap:10px 22px; }
  @media (max-width:760px){ .explain dl { grid-template-columns:1fr; } }
  .explain dt { font-size:13px; font-weight:700; color:var(--text-primary); }
  .explain dd { margin:2px 0 0; font-size:13px; color:var(--text-secondary); line-height:1.5; }
  .explain dd b { color:var(--text-primary); font-weight:600; }
  .bar { height:8px; border-radius:4px; background:var(--grid); overflow:hidden; min-width:70px; }
  .bar i { display:block; height:100%; background:var(--series-1); }
  td.barcell { min-width:110px; } td.barcell .bar { display:inline-block; vertical-align:middle; width:70px; margin-right:6px; }
  .splitseg.mid{background:var(--series-3);color:#000;}
  .splitseg.mid span{opacity:.8;}
  .campnote { font-size:12.5px; color:var(--text-secondary); line-height:1.55; padding:10px 12px 2px; }
  .campnote b { color:var(--text-primary); }
  /* usual questions */
  .faq { display:grid; grid-template-columns:1fr 1fr; gap:14px; margin:0 0 20px; }
  .faq .qa:last-child:nth-child(odd) { grid-column:1 / -1; }
  @media (max-width:820px){ .faq { grid-template-columns:1fr; } }
  .faq .qa { background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:14px 16px 12px; box-shadow:var(--shadow); }
  .faq h4 { margin:0 0 8px; font-size:14.5px; letter-spacing:-0.01em; color:var(--text-primary); }
  .faq h4 .qm { color:var(--series-1); font-weight:800; margin-right:6px; }
  .faq ul { margin:0; padding-left:18px; }
  .faq li { font-size:13.5px; color:var(--text-secondary); line-height:1.5; margin:4px 0; }
  .faq li b { color:var(--text-primary); font-weight:600; }
  .faq li a { color:var(--series-1); text-decoration:none; }
  .faq li a:hover { text-decoration:underline; }
</style>

<body>
<header class="page"><div class="wrap">
  <div class="brandrow">
    <h1>SB Mobile Detailing — Marketing Dashboard</h1>
    <span class="badge" id="mode-badge" style="display:none"></span>
  </div>
  <div class="sub" id="range">&nbsp;</div>
  <div class="source">Google Ads · Fieldd revenue · Google Analytics · Search Console</div>
</div></header>

<div class="toolbar"><div class="inner">
  <nav class="nav">
    <a href="#sec-ads"><span class="d" style="background:var(--series-1)"></span>Google Ads</a>
    <a href="#sec-revenue"><span class="d" style="background:var(--series-5)"></span>Revenue</a>
    <a href="#sec-analytics"><span class="d" style="background:var(--series-2)"></span>Analytics</a>
    <a href="#sec-search"><span class="d" style="background:var(--series-3)"></span>Search Console</a>

</div></div>

<div class="wrap">
  <div id="sections"></div>
  <span class="status" id="status"></span>
</div>

<script>
/* ============================================================================
   CONFIG — published-to-web CSV links for each tab (Date-keyed, daily).
   ============================================================================ */
const ADS_CSV       = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRO5FOESHQfGjP6uZhogNMprPhIAfsT9sewDYTsbAjhLE6cUleyBqiVrWa85-6YMuMkqS_I6inNhW1H/pub?gid=0&single=true&output=csv";
const ANALYTICS_CSV = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRO5FOESHQfGjP6uZhogNMprPhIAfsT9sewDYTsbAjhLE6cUleyBqiVrWa85-6YMuMkqS_I6inNhW1H/pub?gid=532718338&single=true&output=csv";
const SEARCH_CSV    = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRO5FOESHQfGjP6uZhogNMprPhIAfsT9sewDYTsbAjhLE6cUleyBqiVrWa85-6YMuMkqS_I6inNhW1H/pub?gid=255381674&single=true&output=csv";

const DEFAULT_WINDOW = 30;
const REVENUE_WINDOWS = [7,14,30,60,90];
const TABLE_MAX = 31;

/* ---- Formatters ---- */
const money  = v => "$" + Math.round(v).toLocaleString();
const money2 = v => "$" + v.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
const int    = v => Math.round(v).toLocaleString();
const pct    = v => v.toFixed(2) + "%";
const pos    = v => v.toFixed(1);
const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function dayLabel(iso){ const p=String(iso).split("-"); return p.length>=3 ? MONTHS[(+p[1])-1]+" "+(+p[2]) : String(iso); }
function todayISO(){ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }

/* ---- CSV parse ---- */
function parseCSV(text){
  const rows=[]; let row=[],f="",q=false;
  for(let i=0;i<text.length;i++){ const c=text[i];
    if(q){ if(c==='"'&&text[i+1]==='"'){f+='"';i++;} else if(c==='"'){q=false;} else f+=c; }
    else { if(c==='"')q=true; else if(c===','){row.push(f);f="";}
      else if(c==='\n'||c==='\r'){ if(f!==""||row.length){row.push(f);rows.push(row);row=[];f="";} if(c==='\r'&&text[i+1]==='\n')i++; }
      else f+=c; } }
  if(f!==""||row.length){row.push(f);rows.push(row);}
  return rows;
}
const num = s => { const n=parseFloat(String(s).replace(/[^0-9.\-]/g,"")); return isNaN(n)?0:n; };

function shape(csvText, colmap){
  const tISO=todayISO();
  const rows=parseCSV(csvText.trim());
  const head=rows.shift().map(h=>h.trim().toLowerCase());
  const findCol=t=>{ t=t.toLowerCase(); let i=head.indexOf(t); if(i<0)i=head.findIndex(h=>h.includes(t)); return i; };
  const iDate=findCol("date");
  const idx={}; Object.keys(colmap).forEach(k=>idx[k]=findCol(colmap[k]));
  const out=rows.map(r=>{
    const date=String(r[iDate]).trim().substring(0,10);
    const o={ date, label:dayLabel(date), partial: date>=tISO };
    Object.keys(colmap).forEach(k=>o[k]=idx[k]>=0?num(r[idx[k]]):0);
    return o;
  }).filter(o=>/^\d{4}-\d{2}-\d{2}$/.test(o.date)).sort((a,b)=>a.date<b.date?-1:1).slice(-90);
  out.cols=idx;   // which optional columns the feed actually carries (-1 = absent)
  return out;
}

/* The daily Ads feed only carries conversion value once the updated Ads script
   has run (columns "Revenue value", "Lead value", "ROAS"). Until then every
   value-based tile falls back to the 30-day account report. */
function adsHasValue(){ return !!(DATA.ads && DATA.ads.cols && DATA.ads.cols.revVal>=0 && sum(DATA.ads,"revVal")>0); }
function adsRoas(rows){ const c=sum(rows,"cost"), v=sum(rows,"revVal"); return c?v/c:0; }
const roasFmt = v => v ? v.toFixed(2)+"x" : "—";

/* Return figures from the 30-day account report: online bookings carry real
   booking amounts; phone calls carry either $0 or a flat per-call estimate,
   which is a planning figure, never revenue. */
function adsReturn30(a){
  a=a||ANALYSIS; if(!a||!a.conv) return null;
  const isBook=c=>c.category==="PURCHASE"||c.category==="BOOK_APPOINTMENT";
  const isCall=c=>c.category==="PHONE_CALL_LEAD";
  const book=a.conv.filter(isBook), call=a.conv.filter(isCall), other=a.conv.filter(c=>!isBook(c)&&!isCall(c));
  const bookConv=book.reduce((s,c)=>s+c.conversions,0), bookVal=book.reduce((s,c)=>s+c.value,0);
  const callConv=call.reduce((s,c)=>s+c.conversions,0), callVal=call.reduce((s,c)=>s+c.value,0);
  const otherConv=other.reduce((s,c)=>s+c.conversions,0);
  const spend=a.total?a.total.cost:0, totConv=a.total?a.total.conv:(bookConv+callConv+otherConv);
  // placeholder per call, taken only from the call actions that carry a value
  const valued=call.filter(c=>c.value>0&&c.conversions>0);
  const perCall=valued.length? valued.reduce((s,c)=>s+c.value,0)/valued.reduce((s,c)=>s+c.conversions,0) : 0;
  return { bookConv, bookVal, callConv, callVal, perCall, otherConv, spend, totConv, roas: spend?bookVal/spend:0 };
}

/* Accepts "24th Aug", "24th Aug 2026", "2026-08-29", "2026-08-29 14:33:01" and 8/29/2026. */
function parseBilledDate(s){
  const raw=String(s).trim();
  const iso=raw.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if(iso) return iso[1]+"-"+iso[2]+"-"+iso[3];
  const us=raw.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  if(us) return us[3]+"-"+String(+us[1]).padStart(2,"0")+"-"+String(+us[2]).padStart(2,"0");
  const parts=raw.replace(/(\d+)(st|nd|rd|th)/i,"$1").split(/\s+/);
  if(parts.length<2) return "";
  const month=MONTHS.findIndex(m=>m.toLowerCase()===parts[1].slice(0,3).toLowerCase())+1;
  const day=parseInt(parts[0],10);
  if(!month||!day) return "";
  // Year: use it if the source gave one, else infer. A month more than one ahead
  // of the current month belongs to last year, so Dec rows read in Jan do not
  // silently jump forward twelve months.
  const now=new Date();
  const y=(parts[2]&&/^\d{4}$/.test(parts[2])) ? +parts[2]
        : (month > now.getMonth()+2 ? now.getFullYear()-1 : now.getFullYear());
  return y+"-"+String(month).padStart(2,"0")+"-"+String(day).padStart(2,"0");
}

/* Parses a revenue CSV into {isoDate: total}. Sums many rows per day, so it
   takes either a pre-aggregated daily export or the per-sale rows Zapier
   appends. Rows without a positive amount are dropped, which is what removes
   the dead apps-script webhook rows (timestamp in col A, nothing in col B).
   Future-dated rows are dropped too: revenue cannot land ahead of today, so a
   future date means the wrong field got mapped upstream. */
function parseRevenueRows(csvText, matchDate, matchAmount){
  const out={};
  if(!csvText||!csvText.trim()) return out;
  const rows=parseCSV(csvText.trim());
  if(!rows.length) return out;
  const head=rows.shift().map(h=>h.trim().toLowerCase());
  const iDate=head.findIndex(matchDate), iAmt=head.findIndex(matchAmount);
  if(iDate<0||iAmt<0){ console.warn("revenue: header not recognised", head); return out; }
  const tISO=todayISO();
  let future=0;
  for(const r of rows){
    const d=parseBilledDate(r[iDate]);
    if(!/^\d{4}-\d{2}-\d{2}$/.test(d)) continue;
    const v=num(r[iAmt]);
    if(!(v>0)) continue;
    if(d>tISO){ future++; continue; }
    out[d]=(out[d]||0)+v;
  }
  if(future) console.warn("revenue: dropped "+future+" future-dated row(s); check the date field mapped in Zapier");
  return out;
}

/* History (the Billed export) plus the live Zapier feed, stitched at an
   explicit cutover date. History wins strictly before it, live from it onward.

   The cutover is deliberately explicit rather than inferred from the live data.
   Inferring it from the earliest live row breaks whenever the feed is sparse or
   still holds a test record: one $75 test row dated 27 Aug would take over that
   whole day and erase every day after it that the feed had not reached yet. */
function shapeRevenue(historyCsv, liveCsv, cutover){
  cutover = cutover || (typeof REVENUE_CUTOVER!=="undefined" ? REVENUE_CUTOVER : "");
  const hist=parseRevenueRows(historyCsv,
    h=>h.includes("job completed")||h==="date",
    h=>h.includes("total billed")||h.includes("revenue"));
  const live=parseRevenueRows(liveCsv,
    h=>h==="date"||h.includes("date"),
    h=>h.includes("paid amount")||h.includes("amount")||h.includes("revenue"));

  const merged={};
  for(const d in hist) merged[d]=hist[d];

  const usable=/^\d{4}-\d{2}-\d{2}$/.test(cutover)
    ? Object.keys(live).filter(d=>d>=cutover) : [];

  if(cutover && !usable.length){
    console.warn("revenue: live feed has nothing on/after cutover "+cutover+", using history only");
  }
  if(usable.length){
    for(const d in merged) if(d>=cutover) delete merged[d];
    usable.forEach(d=>{ merged[d]=live[d]; });
    const histDates=Object.keys(hist).sort();
    const lastHist=histDates.length?histDates[histDates.length-1]:null;
    if(lastHist){
      const next=new Date(lastHist+"T00:00:00Z"); next.setUTCDate(next.getUTCDate()+1);
      if(next.toISOString().slice(0,10)<cutover)
        console.warn("revenue: gap, history ends "+lastHist+" but cutover is "+cutover+"; refresh Billed (1).csv");
    }
  }

  const tISO=todayISO();
  return Object.keys(merged).sort()
    .map(d=>({ date:d, label:dayLabel(d), partial:d>=tISO, revenue:merged[d] }))
    .slice(-90);
}

function avg(rows,k){ return rows.length ? sum(rows,k)/rows.length : 0; }

function genSample(kind){
  const out=[]; const tISO=todayISO();
  for(let i=89;i>=0;i--){
    const d=new Date(); d.setDate(d.getDate()-i);
    const iso=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
    const dow=d.getDay(); const wk=(dow===0||dow===6)?0.62:1; const wave=1+0.18*Math.sin(i/9)+0.10*Math.sin(i/3.5);
    const o={ date:iso, label:dayLabel(iso), partial: iso>=tISO };
    if(kind==="ads"){ o.clicks=Math.round(42*wave*wk); o.conv=Math.max(0,Math.round(2.4*wave*wk*10)/10);
      o.cost=Math.round(168*wave*wk*100)/100; o.cpl=o.conv?Math.round(o.cost/o.conv*100)/100:0; }
    else if(kind==="analytics"){ o.sessions=Math.round(138*wave*wk); o.users=Math.round(o.sessions*0.86);
      o.engaged=Math.round(o.sessions*0.68); o.pageviews=Math.round(o.sessions*3.1); o.keyev=Math.max(0,Math.round(3*wave*wk)); }
    else { o.impr=Math.round(1850*wave); o.clicks=Math.round(o.impr*(0.035+0.003*Math.sin(i/12)));
      o.ctr=Math.round(o.clicks/o.impr*10000)/100; o.position=Math.round((12.4-0.6*Math.sin(i/15))*10)/10; }
    out.push(o);
  }
  return out;
}

const tt=document.getElementById("tt");

/* ---- line/area chart ---- */
function lineChart(svg,data,key,color,fmt,unit,wide,trend){
  const W=wide?1080:520,H=wide?230:250,m={t:16,r:16,b:30,l:54}, iw=W-m.l-m.r, ih=H-m.t-m.b;
  const vals=data.map(d=>d[key]); const max=Math.max(...vals)*1.1||1, min=Math.min(0,...vals);
  const x=i=>m.l+(data.length===1?iw/2:iw*i/(data.length-1)); const y=v=>m.t+ih-ih*(v-min)/(max-min||1);
  let g="";
  for(let t=0;t<=4;t++){ const v=min+(max-min)*t/4, yy=y(v);
    g+=`<line x1="${m.l}" y1="${yy}" x2="${W-m.r}" y2="${yy}" stroke="var(--grid)" stroke-width="1"/>`;
    g+=`<text x="${m.l-8}" y="${yy+4}" text-anchor="end" font-size="11" fill="var(--muted)">${fmt(v)}</text>`; }
  const everyN=Math.max(1,Math.ceil(data.length/(wide?12:7)));
  data.forEach((d,i)=>{ const isLast=i===data.length-1;
    if(i%everyN===0 || (isLast && (data.length-1)%everyN > everyN/2))
      g+=`<text x="${x(i)}" y="${H-10}" text-anchor="middle" font-size="10" fill="var(--muted)">${d.label}</text>`; });
  let lc=data.length-1; while(lc>0&&data[lc].partial)lc--;
  const solid=data.slice(0,lc+1);
  const al=solid.map((d,i)=>`${i?"L":"M"}${x(i).toFixed(1)},${y(d[key]).toFixed(1)}`).join(" ");
  g+=`<path d="${al} L${x(lc).toFixed(1)},${y(min)} L${x(0).toFixed(1)},${y(min)} Z" fill="${color}" opacity="0.09"/>`;
  for(let i=1;i<data.length;i++){ const dash=(data[i].partial||data[i-1].partial)?' stroke-dasharray="4 3"':'';
    g+=`<path d="M${x(i-1).toFixed(1)},${y(data[i-1][key]).toFixed(1)} L${x(i).toFixed(1)},${y(data[i][key]).toFixed(1)}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round"${dash}/>`; }
  if(trend && data.length>1){
    const pts=data.map((d,i)=>({x:i,y:d[key]||0})).filter(p=>isFinite(p.y));
    const n=pts.length, sx=pts.reduce((a,p)=>a+p.x,0), sy=pts.reduce((a,p)=>a+p.y,0);
    const sxx=pts.reduce((a,p)=>a+p.x*p.x,0), sxy=pts.reduce((a,p)=>a+p.x*p.y,0);
    const den=n*sxx-sx*sx;
    if(n>1 && den){
      const slope=(n*sxy-sx*sy)/den, intercept=(sy-slope*sx)/n;
      const y0=Math.max(min,Math.min(max,intercept));
      const y1=Math.max(min,Math.min(max,intercept+slope*(data.length-1)));
      g+=`<path d="M${x(0).toFixed(1)},${y(y0).toFixed(1)} L${x(data.length-1).toFixed(1)},${y(y1).toFixed(1)}" fill="none" stroke="var(--text-primary)" stroke-width="2" stroke-linecap="round" stroke-dasharray="7 5" opacity="0.72"/>`;
    }
  }
  const bw=iw/data.length;
  data.forEach((d,i)=>{ g+=`<rect x="${(x(i)-bw/2).toFixed(1)}" y="${m.t}" width="${bw.toFixed(1)}" height="${ih}" fill="transparent" class="hit" data-i="${i}"/>`; });
  g+=`<circle id="mk" cx="0" cy="0" r="4" fill="var(--surface)" stroke="${color}" stroke-width="2" opacity="0"/>`;
  svg.innerHTML=g;
  const mk=svg.querySelector("#mk");
  svg.querySelectorAll(".hit").forEach(h=>{ h.addEventListener("mousemove",e=>{ const i=+h.dataset.i,d=data[i];
    mk.setAttribute("cx",x(i)); mk.setAttribute("cy",y(d[key])); mk.setAttribute("opacity","1");
    showTip(`<b>${d.label}${d.partial?" · today":""}</b><div class="row">${fmt(d[key])} ${unit}</div>`,e.clientX,e.clientY); });
    h.addEventListener("mouseleave",()=>{ hideTip(); mk.setAttribute("opacity","0"); }); });
}

function el(tag,cls,html){ const e=document.createElement(tag); if(cls)e.className=cls; if(html!=null)e.innerHTML=html; return e; }
const sum=(rows,k)=>rows.reduce((a,d)=>a+(d[k]||0),0);
const chg=(c,p)=> p? (c-p)/p*100 : null;
const deltaLabel=x=>Math.abs(x)<1?"<1%":Math.abs(x).toFixed(0)+"%";
function arrow(x,goodUp){ if(x===null) return ""; const up=x>=0, good=goodUp?up:!up;
  return ` <span class="${good?"up-txt":"down-txt"}">${up?"up":"down"} ${deltaLabel(x)}</span>`; }

/* ---- build one section for a given window ---- */
function buildSection(cfg,full,window){
  const wd=full.slice(-window);
  const complete=full.filter(d=>!d.partial);
  const cur=complete.slice(-window), prev=complete.slice(-2*window,-window);
  const root=document.getElementById("sections");

  const h=el("div","section-h"); h.id="sec-"+cfg.key;
  const dot=el("span","dot"); dot.style.background=`var(${cfg.color})`; h.appendChild(dot);
  h.appendChild(el("h2",null,cfg.title));
  h.appendChild(el("span","note",`Last ${window} days${prev.length?` vs previous ${window}`:""}`));
  if(cfg.key==="revenue"){
    const mf=el("span","mini-filter");
    REVENUE_WINDOWS.forEach(w=>{
      const b=el("button",w===revenueWindow?"active":"",String(w)+"d");
      b.type="button"; b.dataset.revenueWindow=String(w); mf.appendChild(b);
    });
    h.appendChild(mf);
  }
  root.appendChild(h);

  if(!full || full.length===0){
    const box=el("div","analysis"); box.style.borderLeftColor=`var(${cfg.color})`;
    box.innerHTML=`<div class="h">Temporarily unavailable</div><p>This section couldn't load right now — please refresh in a moment.</p>`;
    root.appendChild(box); return;
  }

  const tiles=cfg.tiles.filter(t=>!t.when||t.when());
  const kp=el("div","kpis"+(tiles.length>4?" six":""));
  tiles.forEach(t=>{
    const cv=t.val(cur), pv=prev.length?t.val(prev):null, d=chg(cv,pv);
    const up=d>=0, good=t.goodUp?up:!up;
    kp.appendChild(el("div","tile",
      `<div class="label">${t.label}</div><div class="value">${t.fmt(cv)}</div>
       <div class="delta ${d===null?"":(good?"up":"down")}">${d===null?'<span class="vs">—</span>':`${up?"▲":"▼"} ${deltaLabel(d)} <span class="vs">vs prev ${window}d</span>`}</div>`
      +(t.hint?`<div class="hint">${t.hint}</div>`:"")));
  });
  root.appendChild(kp);

  // "since the budget increase" strip: the full days since the change against
  // the same number of full days immediately before it, so the two sides are
  // always like for like. (The old version compared against every day before
  // the baseline that happened to be inside the 90-day feed, which shrank to
  // nothing once the feed rolled past the baseline date.)
  if(cfg.baseline){
    const after=complete.filter(d=>d.date>=cfg.baseline);
    const before=complete.filter(d=>d.date<cfg.baseline).slice(-after.length);
    if(after.length&&before.length){
      const bl=dayLabel(cfg.baseline), n=after.length, testLen=cfg.baselineDays||0;
      const cplA=sum(after,"conv")?sum(after,"cost")/sum(after,"conv"):0, cplB=sum(before,"conv")?sum(before,"cost")/sum(before,"conv"):0;
      const items=[
        {label:"Spend",cur:sum(after,"cost"),prev:sum(before,"cost"),fmt:money,goodUp:true,neutral:true},
        {label:"Conversions",cur:sum(after,"conv"),prev:sum(before,"conv"),fmt:int,goodUp:true},
        {label:"Conversions / day",cur:sum(after,"conv")/n,prev:sum(before,"conv")/before.length,fmt:v=>v.toFixed(1),goodUp:true},
        {label:"Cost / conv.",cur:cplA,prev:cplB,fmt:money2,goodUp:false} ];
      if(adsHasValue()){
        items.push({label:"Booking value",cur:sum(after,"revVal"),prev:sum(before,"revVal"),fmt:money,goodUp:true});
        items.push({label:"ROAS",cur:adsRoas(after),prev:adsRoas(before),fmt:roasFmt,goodUp:true});
      }
      const dayNote=testLen?`day ${Math.min(n,testLen)} of the ${testLen}-day test`:`${n} full days`;
      root.appendChild(el("div","subhead",`Since ${cfg.baselineLabel||"the change"} on ${bl} <span>— ${dayNote}, against the ${before.length} days before it</span>`));
      const row=el("div","kpis"+(items.length>4?" six":""));
      items.forEach(t=>{const d=chg(t.cur,t.prev),up=d>=0,good=t.goodUp?up:!up;
        row.appendChild(el("div","tile",`<div class="label">${t.label}</div><div class="value">${t.fmt(t.cur)}</div><div class="delta ${t.neutral?"":(good?"up":"down")}">${d===null?'<span class="vs">—</span>':`${up?"▲":"▼"} ${deltaLabel(d)} <span class="vs">vs the ${before.length} days before</span>`}</div>`));});
      root.appendChild(row);
      // dated caveat, shown only while the comparison window overlaps it
      const cv=cfg.baselineCaveat;
      if(cv && before.some(d=>d.date>=cv.from&&d.date<=cv.to)) root.appendChild(el("div","tnote",cv.text));
    }
  }

  // plain-English analysis
  const a=el("div","analysis"); a.style.borderLeftColor=`var(${cfg.color})`;
  a.innerHTML=`<div class="h">What this means</div><p>${cfg.analyze(cur,prev,window)}</p>`;
  root.appendChild(a);

  // the questions the client asks on every call, answered from the data
  if(cfg.key==="ads") renderAdsFAQ(root,cfg,complete,cur,prev,window);

  // plain-English definitions, collapsed by default
  if(cfg.explainer){
    const ex=el("details","explain");
    ex.innerHTML=`<summary><span class="q">?</span>How to read these numbers<span class="hintt">tap to open</span></summary><dl>${cfg.explainer().map(([k,v])=>`<div><dt>${k}</dt><dd>${v}</dd></div>`).join("")}</dl>`;
    root.appendChild(ex);
  }

  const charts=cfg.charts.filter(c=>!c.when||c.when());
  const g2=el("div","grid2"); const svgs=[];
  charts.filter(c=>!c.wide).forEach(c=>{
    const card=el("div","card",`<h3>${c.title}</h3><p class="cap">${c.cap}</p>`);
    const svg=document.createElementNS("http://www.w3.org/2000/svg","svg");
    svg.setAttribute("class","chart"); svg.setAttribute("viewBox","0 0 520 250");
    card.appendChild(svg); g2.appendChild(card); svgs.push({c,svg});
  });
  root.appendChild(g2);
  charts.filter(c=>c.wide).forEach(c=>{
    const card=el("div","card",`<h3>${c.title}</h3><p class="cap">${c.cap}</p>`);
    const svg=document.createElementNS("http://www.w3.org/2000/svg","svg");
    svg.setAttribute("class","chart"); svg.setAttribute("viewBox","0 0 1080 230");
    card.appendChild(svg); root.appendChild(card); svgs.push({c,svg});
  });
  svgs.forEach(({c,svg})=>lineChart(svg,wd,c.key,`var(${c.color})`,c.fmt,c.unit,!!c.wide,!!c.trend));

  // account breakdown (real data from KAs 00-analysis)
  if(cfg.breakdown && ANALYSIS) renderAdsBreakdown(root,ANALYSIS);
  // pending scaffold (honest placeholder — no fake data)
  if(cfg.pending) root.appendChild(el("div","pending",`<b>Coming next:</b> ${cfg.pending}`));

  if(!cfg.hideTable){
    const tableMax=cfg.tableMax || TABLE_MAX;
    const isLongTable=wd.length>14;
    const tcard=el("div","card",`<h3>Daily detail</h3><p class="cap">Most recent first${isLongTable?" · scroll inside the list":""}</p>`);
    const tw=el("div","tablewrap"+(isLongTable?" detail-scroll":""));
    const thead="<tr>"+cfg.columns.map(c=>`<th>${c.label}</th>`).join("")+"</tr>";
    const shown=[...wd].reverse().slice(0,tableMax);
    const tbody=shown.map(d=>`<tr class="${d.partial?"partial":""}">`+
      cfg.columns.map(c=>`<td>${c.key==="label"?(d.label+(d.partial?" · today":"")):c.fmt(d[c.key])}</td>`).join("")+"</tr>").join("");
    tw.appendChild(el("table",null,"<thead>"+thead+"</thead><tbody>"+tbody+"</tbody>"));
    tcard.appendChild(tw);
    if(wd.length>tableMax) tcard.appendChild(el("div","tnote",`Showing the most recent ${tableMax} of ${wd.length} days in view.`));
    root.appendChild(tcard);
  }
}

/* "The questions you usually ask": one card per question Luke and Jeremy raise
   on the weekly call, each answered in two or three computed bullets. Every
   figure comes from the same data as the tiles, so the answers cannot drift
   from the board. */
function renderAdsFAQ(root,cfg,complete,cur,prev,window){
  const a=ANALYSIS, r=adsReturn30(a);
  const cplOf=rows=>{const c=sum(rows,"cost"),v=sum(rows,"conv");return v?c/v:0;};
  const w7=complete.slice(-7), p7=complete.slice(-14,-7);
  const after=complete.filter(d=>d.date>=cfg.baseline), before=complete.filter(d=>d.date<cfg.baseline).slice(-after.length);
  const hv=adsHasValue();
  const cards=[];

  // 1. How many jobs did Google Ads bring in?
  {
    const b=[];
    if(r) b.push(`Last 30 days: <b>${int(r.bookConv)} jobs booked online</b> after an ad click, worth <b>${money(r.bookVal)}</b>, plus <b>${int(r.callConv)} phone calls</b> from ads whose outcome is not tracked yet.`);
    if(after.length&&before.length) b.push(`Since the budget increase: <b>${(sum(after,"conv")/after.length).toFixed(1)} conversions a day</b>, against ${(sum(before,"conv")/before.length).toFixed(1)} a day in the ${before.length} days before.`);
    b.push(`Jobs booked by phone or text after seeing an ad are not counted anywhere yet. CallRail will add them.`);
    cards.push(["How many jobs did Google Ads bring in?",b]);
  }
  // 2. What did we get back for the spend?
  {
    const b=[];
    if(hv){ const v=sum(cur,"revVal"), roas=adsRoas(cur); b.push(`Last ${window} days: <b>${money(sum(cur,"cost"))} spent</b>, <b>${money(v)} booked online</b>, a <b>${roasFmt(roas)}</b> return.`); }
    else if(r&&r.spend) b.push(`Last 30 days: <b>${money(r.spend)} spent</b>, <b>${money(r.bookVal)} booked online</b>, a <b>${roasFmt(r.roas)}</b> return.`);
    b.push(`That return counts <b>online bookings only</b>. With roughly 80% of jobs booked by phone or text, the true figure is higher; treat it as the floor.`);
    b.push(`Cost per conversion (booking or call) is <b>${money2(cplOf(cur))}</b> over the last ${window} days${prev.length?`, ${chg(cplOf(cur),cplOf(prev))<=0?"down":"up"} from ${money2(cplOf(prev))}`:""}.`);
    cards.push(["What did we get back for the spend?",b]);
  }
  // 3. How much is going to tint and PPF?
  {
    const b=[];
    b.push(`There is <b>no separate tint or PPF campaign</b>. Those keywords sit inside Search and Performance Max, and Google spends where it expects the cheapest bookings.`);
    if(a&&a.adgroups&&a.adgroups.length){
      const g=svc=>a.adgroups.filter(x=>serviceOf(x.name)===svc);
      const tot=x=>({cost:sum(x,"cost"),conv:sum(x,"conv")});
      const t=tot(g("Window tint")), p=tot(g("Paint protection film")), all=sum(a.adgroups,"cost");
      b.push(`Last 30 days on Search: tint <b>${money(t.cost)}</b> (${all?Math.round(t.cost/all*100):0}%) for ${t.conv.toFixed(0)} conversions; PPF <b>${money(p.cost)}</b> (${all?Math.round(p.cost/all*100):0}%) for ${p.conv.toFixed(0)}. Full split in <a href="#svc-split">Spend by service</a>.`);
      b.push(`A small share means few affordable tint searches in the area right now, not a decision to skip the service. Tint keywords convert well when they do show.`);
    } else {
      b.push(`The exact dollars per service arrive with the next report update; until then the split by campaign below is the closest view.`);
      b.push(`On the last check tint was about $70 of a month's spend, with a very high conversion rate on the few searches it found.`);
    }
    cards.push(["How much is going to tint and PPF?",b]);
  }
  // 4. Is this week better than last?
  {
    const b=[];
    if(w7.length===7&&p7.length===7){
      const c1=sum(w7,"conv"), c0=sum(p7,"conv"), k1=cplOf(w7), k0=cplOf(p7);
      b.push(`Last 7 full days: <b>${int(c1)} conversions</b> at <b>${money2(k1)}</b> each, against ${int(c0)} at ${money2(k0)} the week before${arrow(chg(c1,c0),true)} on volume.`);
      b.push(`Spend was <b>${money(sum(w7,"cost"))}</b> versus ${money(sum(p7,"cost"))}.`);
    } else b.push(`Needs two full weeks of data.`);
    b.push(`Google keeps adding conversions to a day for up to a week, so the newest days always read a little low at first.`);
    cards.push(["Is this week better than last week?",b]);
  }
  // 5. Where did the money go: Brand, Search, Performance Max?
  if(a&&a.campaigns&&a.campaigns.length){
    const b=[]; const tc=a.total?a.total.cost:sum(a.campaigns,"cost"), tv=a.total?a.total.conv:sum(a.campaigns,"conv");
    [...a.campaigns].sort((x,y)=>y.cost-x.cost).slice(0,3).forEach(c=>{
      b.push(`<b>${shortCamp(c.name)}</b>: ${money(c.cost)} (${tc?Math.round(c.cost/tc*100):0}% of spend) for ${c.conv} conversions (${tv?Math.round(c.conv/tv*100):0}%) at ${money2(c.cpl)} each${a.hasCampaignValue&&c.value!=null?`, ${money(c.value)} booked online`:""}.`);
    });
    cards.push(["Where did the money go?",b]);
  }
  // 6. How is the budget test going?
  if(after.length&&before.length){
    const b=[]; const n=after.length, L=cfg.baselineDays||30;
    b.push(`<b>Day ${Math.min(n,L)} of ${L}</b>. Spend is ${money(sum(after,"cost"))} over ${n} days, about <b>${money(sum(after,"cost")/n*30)} a month</b> at this pace.`);
    b.push(`Conversions per day ${arrow(chg(sum(after,"conv")/n,sum(before,"conv")/before.length),true)} and cost per conversion ${arrow(chg(cplOf(after),cplOf(before)),false)} versus the ${before.length} days before.`);
    if(cfg.baselineCaveat&&before.some(d=>d.date>=cfg.baselineCaveat.from&&d.date<=cfg.baselineCaveat.to)) b.push(`The "before" days include the 13 to 23 Aug tracking break, so the lift reads bigger than it really is.`);
    cards.push(["How is the budget increase doing?",b]);
  }
  // 7. What is a 0.5 conversion, and the $50 on a call?
  {
    const per=r&&r.perCall?money(r.perCall):"$50";
    cards.push(["What is a .5 conversion, and the "+per+" on a call?",[
      `A <b>.5</b> is a phone call from an ad. Google weights a call as half a booking, so 4.5 conversions means, for example, 4 bookings and one call.`,
      `The <b>${per}</b> is a flat placeholder Google puts on some calls. It is not money that arrived, so it is <b>never</b> counted in booking value or the return figure.`,
      `Once CallRail tags each call as booked or not, the real job value replaces the placeholder.`]]);
  }

  root.appendChild(el("div","subhead",`The questions you usually ask <span>— answered from the numbers on this page</span>`));
  const grid=el("div","faq");
  cards.forEach(([q,items])=>{ grid.appendChild(el("div","qa",`<h4><span class="qm">Q</span>${q}</h4><ul>${items.slice(0,3).map(t=>`<li>${t}</li>`).join("")}</ul>`)); });
  root.appendChild(grid);
}

function renderPriorities(root){
  const h=el("div","section-h"); h.innerHTML=`<h2>Priorities</h2><span class="note">Google Ads — worked out from the last 30 days of account data</span>`;
  root.appendChild(h);
  const a=ANALYSIS, r30=adsReturn30(a);
  const ads=(DATA.ads||[]).filter(d=>!d.partial);
  const cur=ads.slice(-30), prev=ads.slice(-60,-30);
  const cpl=rows=>{const c=sum(rows,"cost"),v=sum(rows,"conv");return v?c/v:0;};
  const wins=[], watch=[];

  // wins
  if(prev.length>=20){
    const dConv=chg(sum(cur,"conv"),sum(prev,"conv")), dCpl=chg(cpl(cur),cpl(prev));
    if(dConv!==null&&dConv>=10) wins.push(`<b>${int(sum(cur,"conv"))} conversions</b> in the last 30 days, up ${deltaLabel(dConv)} on the 30 days before.`);
    if(dCpl!==null&&dCpl<=-10) wins.push(`Cost per conversion is down ${deltaLabel(dCpl)} to <b>${money2(cpl(cur))}</b>: each booking or call is costing less.`);
    else if(dCpl!==null&&dCpl>=15) watch.push({p:"P1",t:"Cost per conversion is rising",d:`Up ${deltaLabel(dCpl)} to ${money2(cpl(cur))} versus the previous 30 days. Expected while the budget increase buys auctions we were not in before; we watch that it settles.`});
  }
  if(r30&&r30.spend&&r30.bookVal) wins.push(`Online bookings from ads are worth <b>${money(r30.bookVal)}</b> on ${money(r30.spend)} of spend, a <b>${roasFmt(r30.roas)}</b> return before any phone bookings.`);
  if(a&&a.campaigns&&a.campaigns.length){
    const enabled=a.campaigns.filter(c=>c.status==="ENABLED"&&c.conv>0);
    const best=[...enabled].sort((x,y)=>x.cpl-y.cpl)[0];
    if(best) wins.push(`<b>${best.name.replace(/\s*\(.*?\)\s*/g,"")}</b> is the most efficient campaign at ${money2(best.cpl)} per conversion.`);
  }

  // watch-items
  if(r30&&r30.callConv>0){
    const share=r30.totConv?Math.round(r30.callConv/r30.totConv*100):0;
    watch.push({p:"P0",t:"Phone calls from ads carry no real value yet",d:`${int(r30.callConv)} of ${int(r30.totConv)} conversions (${share}%) were phone calls, counted at ${r30.perCall?money(r30.perCall)+" each as a placeholder":"$0"}. Until CallRail tags which calls booked, the return above is a floor, not the real number.`});
  }
  if(a&&a.devices){
    const desk=a.devices.find(d=>d.device==="DESKTOP"), mob=a.devices.find(d=>d.device==="MOBILE");
    if(desk&&mob&&desk.cpl&&mob.cpl&&desk.cpl>mob.cpl*1.3&&desk.cost>200)
      watch.push({p:"P1",t:"Desktop cost per lead well above mobile",d:`Desktop is ${money2(desk.cpl)} per conversion against ${money2(mob.cpl)} on mobile. Device bid adjustments are the quickest fix.`});
  }
  if(a&&a.change&&a.change.autoApply>0)
    watch.push({p:"P1",t:"Google Auto-Apply is changing the account",d:`${a.change.autoApply} automated changes in the last 14 days. We review and switch off the ones we do not want.`});
  if(cur.length>=7){
    const last7=cur.slice(-7), zeroDays=last7.filter(d=>d.cost>20&&d.conv===0).length;
    if(zeroDays>=3) watch.push({p:"P0",t:"Possible conversion-tracking gap",d:`${zeroDays} of the last 7 days show spend with no conversions. That pattern last time was a tracking fault, not a performance drop, so we check it first.`});
  }
  if(!wins.length) wins.push("Nothing stands out yet: the comparison needs at least 20 days on each side.");
  if(!watch.length) watch.push({p:"P2",t:"Nothing flagged",d:"No efficiency or tracking issue in the last 30 days of account data."});

  const box=el("div","priorities");
  box.innerHTML=`<div class="pcol"><div class="ph win">Wins</div>${wins.map(w=>`<div class="pitem"><span class="pdot"></span><span>${w}</span></div>`).join("")}</div>`
   +`<div class="pcol"><div class="ph watch">Watch-items</div>${watch.map(w=>`<div class="pitem"><span class="pbadge ${w.p.toLowerCase()}">${w.p}</span><span><b>${w.t}.</b> ${w.d}</span></div>`).join("")}</div>`;
  root.appendChild(box);
}

      {label:"Clicks",key:"clicks",fmt:int,goodUp:true,val:r=>sum(r,"clicks")},
      {label:"Impressions",key:"impr",fmt:int,goodUp:true,val:r=>sum(r,"impr")},
      {label:"CTR",key:"ctr",fmt:pct,goodUp:true,val:r=>{const c=sum(r,"clicks"),im=sum(r,"impr");return im?c/im*100:0;}},
      {label:"Avg position",key:"position",fmt:pos,goodUp:false,val:r=>{const wgt=r.reduce((a,d)=>a+d.position*d.impr,0),im=sum(r,"impr");return im?wgt/im:0;}} ],
    charts:[
      {key:"clicks",title:"Search clicks / day",cap:"Organic clicks from Google",color:"--series-3",fmt:int,unit:"clicks"},
      {key:"impr",title:"Impressions / day",cap:"Times shown in search",color:"--series-1",fmt:int,unit:"impressions"},
      {key:"position",title:"Average position",cap:"Lower is better",color:"--series-4",fmt:pos,unit:"avg position",wide:true} ],
    columns:[ {label:"Date",key:"label"},{label:"Clicks",key:"clicks",fmt:int},{label:"Impressions",key:"impr",fmt:int},
              {label:"CTR",key:"ctr",fmt:pct},{label:"Avg position",key:"position",fmt:pos} ],
    analyze:(cur,prev,w)=>{
      const c=sum(cur,"clicks"),im=sum(cur,"impr"),ctr=im?c/im*100:0;
      const posW=im?cur.reduce((a,d)=>a+d.position*d.impr,0)/im:0;
      const dC=chg(c,sum(prev,"clicks"));
      const pPos=sum(prev,"impr")?prev.reduce((a,d)=>a+d.position*d.impr,0)/sum(prev,"impr"):0;
      const dPos=chg(posW,pPos);
      let posRead = dPos!==null ? (dPos<0?'<span class="up-txt">improved</span>':'<span class="down-txt">slipped</span>') : "";
      return `In organic search over the last <b>${w} days</b>, SBD earned <b>${int(c)} clicks</b> from <b>${int(im)} impressions</b> (a <b>${ctr.toFixed(2)}% CTR</b>), at an average position of <b>${pos(posW)}</b>.`
        + (prev.length?` Clicks are${arrow(dC,true)} and the average ranking ${posRead} versus the previous ${w} days (lower position = higher on the page).`:"");
    } },
];

let ANALYSIS=null;

function parseAnalysis(text){
  const rows=parseCSV(text.trim());
  const out={generated:"",campaigns:[],total:null,devices:[],conv:[],adgroups:[],keywords:[],terms:[],hasCampaignValue:false,change:{total:0,autoApply:0,byType:[]}};
  let mode="";
  const hasVal=r=>r.length>9 && String(r[9]).trim()!=="";
  for(const r of rows){
    const a=(r[0]||"").trim();
    if(a==="Generated"){ out.generated=(r[1]||"").trim(); continue; }
    if(a.startsWith("CAMPAIGN KPIs")){mode="camp";continue;}
    if(a.startsWith("DEVICE SPLIT")){mode="dev";continue;}
    if(a.startsWith("CONVERSION ACTIONS")){mode="conv";continue;}
    if(a.startsWith("AD GROUPS")){mode="adg";continue;}
    if(a.startsWith("KEYWORDS")){mode="kw";continue;}
    if(a.startsWith("SEARCH TERMS")){mode="term";continue;}
    if(a.startsWith("CHANGE HISTORY")){mode="chg";continue;}
    if(a==="Campaign"||a==="Device"||a==="Action"||a==="Ad group"||a==="Keyword"||a==="Search term"||a==="By user"||a==="By change type"){continue;}
    if(!a||a.startsWith("(")){continue;}   // "(... query needs a tweak ...)" rows are notes, not data
    if(mode==="camp"){
      const row={clicks:num(r[2]),impr:num(r[3]),cost:num(r[4]),conv:num(r[5]),cpl:num(r[6]),ctr:num(r[7]),cvr:num(r[8]),
                 value:hasVal(r)?num(r[9]):null, roas:hasVal(r)?num(r[10]):null};
      if(hasVal(r)) out.hasCampaignValue=true;
      if(a==="ACCOUNT TOTAL") out.total=row;
      else out.campaigns.push(Object.assign({name:a,status:(r[1]||"").trim()},row));
    } else if(mode==="dev"){ out.devices.push({device:a,clicks:num(r[1]),cost:num(r[2]),conv:num(r[3]),cpl:num(r[4])}); }
    else if(mode==="adg"){ out.adgroups.push({name:a,campaign:(r[1]||"").trim(),clicks:num(r[2]),impr:num(r[3]),cost:num(r[4]),conv:num(r[5]),cpl:num(r[6])}); }
    else if(mode==="kw"){ out.keywords.push({text:a,match:(r[1]||"").trim(),campaign:(r[2]||"").trim(),clicks:num(r[3]),impr:num(r[4]),cost:num(r[5]),conv:num(r[6]),cpl:num(r[7])}); }
    else if(mode==="term"){ out.terms.push({text:a,campaign:(r[1]||"").trim(),clicks:num(r[2]),impr:num(r[3]),cost:num(r[4]),conv:num(r[5]),cpl:num(r[6])}); }
    else if(mode==="conv"){ out.conv.push({action:a,category:(r[1]||"").trim(),conversions:num(r[2]),value:num(r[3])}); }
    else if(mode==="chg"){
      if(a==="Total events") out.change.total=num(r[1]);
      else if(a==="Recommendations Auto-Apply") out.change.autoApply=num(r[1]);
      else if(/^[A-Z][A-Z_]+$/.test(a) && String(r[1]).trim()!=="") out.change.byType.push({type:a,count:num(r[1])});
    }
  }
  return out;
}

const shortCamp = n => String(n).replace(/\s*\(.*?\)\s*/g,"").trim();

  const tc=el("div","card"); tc.id="term-split";
  if(a.terms && a.terms.length){

    let tt=`<h3>What people actually typed</h3><p class="cap">Top search terms by spend, last 30 days. Google withholds low-volume terms, so these never add up to the full spend.</p><div class="tablewrap"><table><thead><tr><th>Search term</th><th>Spend</th><th>Clicks</th><th>Conv</th><th>Cost / conv</th></tr></thead><tbody>`;

    tc.className="pending";
    tc.innerHTML=`<b>Coming next: search terms.</b> The actual phrases people typed before clicking, and which of them wasted spend. The account report is being extended to include it.`;
  }
  root.appendChild(tc);

  // 4. Device split
  let dt=`<h3>By device</h3><p class="cap">Cost per conversion on phones vs computers</p><div class="tablewrap"><table><thead><tr><th>Device</th><th>Spend</th><th>Conv</th><th>Cost / conv</th></tr></thead><tbody>`;
  a.devices.filter(d=>d.cost>0).forEach(d=>{ dt+=`<tr><td>${d.device.charAt(0)+d.device.slice(1).toLowerCase().replace("_"," ")}</td><td>${money(d.cost)}</td><td>${d.conv}</td><td>${d.cpl?money2(d.cpl):'—'}</td></tr>`; });
  dt+=`</tbody></table></div>`;
  const desk=a.devices.find(d=>d.device==='DESKTOP'), mob=a.devices.find(d=>d.device==='MOBILE');

    else if(ratio<0.77) dt+=`<div class="tnote">Desktop is currently the cheaper device (${money2(desk.cpl)} vs ${money2(mob.cpl)} on mobile), but mobile carries ${totCost?Math.round(mob.cost/totCost*100):0}% of spend and most of the volume, so both matter.</div>`;

  const topTypes=[...a.change.byType].sort((x,y)=>y.count-x.count).slice(0,3).map(t=>`${t.type.replace(/_/g,' ').toLowerCase()} ${t.count.toLocaleString()}`).join(" · ");

  root.appendChild(ch);
}

let KLAVIYO=null;

function parseKlaviyo(text){
  const rows=parseCSV(text.trim());
  const out={generated:"",channels:[],campaigns:[],lists:[]};
  let mode="";
  for(const r of rows){
    const a=(r[0]||"").trim();
    if(a==="Generated"){out.generated=(r[1]||"").trim();continue;}
    if(a==="CHANNEL SUMMARY"){mode="chan";continue;}
    if(a==="RECENT CAMPAIGNS"){mode="camp";continue;}
    if(a==="LISTS"){mode="lists";continue;}
    if(a==="Channel"||a==="Date"||a==="List"){continue;}
    if(!a){continue;}
    if(mode==="chan") out.channels.push({channel:a,campaigns:num(r[1]),recipients:num(r[2]),clicks:num(r[3]),ctr:num(r[4])});
    else if(mode==="camp") out.campaigns.push({date:a,channel:(r[1]||"").trim(),name:(r[2]||"").trim(),recipients:num(r[3]),clicks:num(r[4]),ctr:num(r[5])});
    else if(mode==="lists") out.lists.push({name:a,count:(r[1]!=null&&String(r[1]).trim()!=="")?num(r[1]):null});
  }
  return out;
}

function renderKlaviyoSection(root){
  const k=KLAVIYO; if(!k||(!k.channels.length&&!k.campaigns.length)) return;
  const h=el("div","section-h"); h.id="sec-klaviyo";
  const dot=el("span","dot"); dot.style.background="var(--series-4)"; h.appendChild(dot);
  h.appendChild(el("h2",null,"Email & SMS (Klaviyo)"));
  h.appendChild(el("span","note","Last 30 days"));
  root.appendChild(h);

  const em=k.channels.find(c=>/email/i.test(c.channel))||{}, sm=k.channels.find(c=>/sms/i.test(c.channel))||{};
  const kp=el("div","kpis");
  [{label:"Email recipients",v:int(em.recipients||0)},{label:"Email CTR",v:pct(em.ctr||0)},
   {label:"SMS recipients",v:int(sm.recipients||0)},{label:"SMS CTR",v:pct(sm.ctr||0)}].forEach(t=>{
    kp.appendChild(el("div","tile",`<div class="label">${t.label}</div><div class="value">${t.v}</div>`)); });
  root.appendChild(kp);

  const a=el("div","analysis"); a.style.borderLeftColor="var(--series-4)";
  a.innerHTML=`<div class="h">What this means</div><p>Over the last 30 days, <b>SMS drove ${int(sm.clicks||0)} clicks at ${pct(sm.ctr||0)}</b> versus email's ${int(em.clicks||0)} at ${pct(em.ctr||0)} — <b>SMS is doing the heavy lifting</b>. We report reach and engagement here, not revenue: Klaviyo-attributed revenue currently reads $0 because there is no valued booking event yet, so revenue/ROAS stays out until that's wired in. Open rate is intentionally omitted (Apple Mail privacy inflates it — it isn't a real signal).</p>`;
  root.appendChild(a);

  const cc=el("div","card");
  let ct=`<h3>Recent campaigns</h3><p class="cap">Email &amp; SMS sends — last 30 days</p><div class="tablewrap"><table><thead><tr><th>Date</th><th>Channel</th><th>Campaign</th><th>Recipients</th><th>Clicks</th><th>CTR</th></tr></thead><tbody>`;
  k.campaigns.forEach(c=>{ ct+=`<tr><td>${dayLabel(c.date)}</td><td>${c.channel}</td><td>${c.name}</td><td>${int(c.recipients)}</td><td>${int(c.clicks)}</td><td>${pct(c.ctr)}</td></tr>`; });
  ct+=`</tbody></table></div>`; cc.innerHTML=ct; root.appendChild(cc);

  const lc=el("div","card");
  let lt=`<h3>List growth &amp; consent</h3><p class="cap">Subscriber counts</p><div class="tablewrap"><table><thead><tr><th>List</th><th>Subscribers</th></tr></thead><tbody>`;
  k.lists.forEach(l=>{ lt+=`<tr><td>${l.name}</td><td>${l.count==null?'—':int(l.count)}</td></tr>`; });
  lt+=`</tbody></table></div><div class="tnote">Snapshotted daily — this builds a growth trend over time.</div>`;
  lc.innerHTML=lt; root.appendChild(lc);
}

const SOURCES={ revenue:REVENUE_CSV, ads:ADS_CSV, analytics:ANALYTICS_CSV, search:SEARCH_CSV };
const DATA={}; let anyLive=false, anyErr="";

async function loadAll(){
  // load KAs account-report analysis (live URL if set, else the embedded snapshot)
  try{
    if(ADS_ANALYSIS_URL){ const r=await fetch(ADS_ANALYSIS_URL); if(!r.ok) throw 0; ANALYSIS=parseAnalysis(await r.text()); ANALYSIS.live=true; }
    else { ANALYSIS=parseAnalysis(ADS_ANALYSIS_SNAPSHOT); ANALYSIS.live=false; }
  }catch(e){ ANALYSIS=parseAnalysis(ADS_ANALYSIS_SNAPSHOT); ANALYSIS.live=false; }
  try{
    if(KLAVIYO_CSV){ const r=await fetch(KLAVIYO_CSV); if(!r.ok) throw 0; KLAVIYO=parseKlaviyo(await r.text()); }
    else KLAVIYO=parseKlaviyo(KLAVIYO_SNAPSHOT);
  }catch(e){ KLAVIYO=parseKlaviyo(KLAVIYO_SNAPSHOT); }
  for(const cfg of CONFIGS){
    const url=SOURCES[cfg.key];
    if(cfg.key==="revenue"){
      let histText=REVENUE_SNAPSHOT;
      if(url){ try{ const res=await fetch(url); if(res.ok) histText=await res.text(); }catch(e){} }
      let liveText="";
      if(FIELDD_LIVE_CSV){
        try{ const res=await fetch(FIELDD_LIVE_CSV);
             if(res.ok){ liveText=await res.text(); anyLive=true; }
             else console.warn("revenue: live feed HTTP "+res.status);
        }catch(e){ console.warn("revenue: live feed unreachable, history only"); }
      }
      DATA.revenue=shapeRevenue(histText, liveText, REVENUE_CUTOVER);
      continue;
    }
    if(url){ try{ const res=await fetch(url); if(!res.ok) throw new Error("HTTP "+res.status);
      DATA[cfg.key]=shape(await res.text(),cfg.colmap); anyLive=true; continue; }
      catch(e){ anyErr=e.message; DATA[cfg.key]=[]; continue; } }   // live source failed → empty, never fake data
    DATA[cfg.key]=genSample(cfg.key);                               // sample only when no URL is configured (dev preview)
  }
}

function rebuild(window){
  currentWindow = window;
  const root=document.getElementById("sections"); root.innerHTML="";
  renderPriorities(root);
  renderWoW(root);
  let minD="9999-99-99", maxD="0";
  CONFIGS.forEach(cfg=>{
    const activeWindow=cfg.key==="revenue"?revenueWindow:window;
    const wd=(DATA[cfg.key]||[]).slice(-activeWindow);
    if(cfg.key!=="revenue" && wd.length){ if(wd[0].date<minD)minD=wd[0].date; if(wd[wd.length-1].date>maxD)maxD=wd[wd.length-1].date; }
    buildSection(cfg,DATA[cfg.key]||[],activeWindow);
  });
  renderKlaviyoSection(root);
  document.querySelectorAll("[data-revenue-window]").forEach(b=>b.addEventListener("click",()=>{
    revenueWindow=+b.dataset.revenueWindow;
    rebuild(currentWindow);
    document.getElementById("sec-revenue")?.scrollIntoView({block:"start"});
  }));
  document.querySelectorAll("#seg button").forEach(b=>b.classList.toggle("active",+b.dataset.w===window));
  if(maxD!=="0") document.getElementById("range").textContent=`${dayLabel(minD)} – ${dayLabel(maxD)} · last ${window} days`;
  const badge=document.getElementById("mode-badge");
  if(anyLive && maxD!=="0"){ badge.textContent="Updated "+dayLabel(maxD); badge.style.display=""; }
  else badge.style.display="none";
}

async function boot(){
  await loadAll();
  document.querySelectorAll("#seg button").forEach(b=>b.addEventListener("click",()=>rebuild(+b.dataset.w)));
  rebuild(DEFAULT_WINDOW);
  // status line is internal-only; keep it silent for the client unless a real error occurs
  const st=document.getElementById("status");
  if(anyErr && !anyLive) st.textContent="Data is temporarily unavailable — please refresh in a moment.";
  else st.textContent="";
}
boot();
